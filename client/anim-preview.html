<!doctype html>
<html><head><meta charset="utf-8"><title>Anim-Vorschau</title>
<style>body{margin:0;background:#9fb3c8;overflow:hidden}#l{position:fixed;left:12px;top:10px;font:bold 22px sans-serif;color:#fff;text-shadow:0 2px 4px #000}</style></head>
<body><div id="l"></div>
<script type="module">
import * as THREE from 'three';
import { Rig, MODE } from './src/anim.js';
import { makeTextures } from './src/textures.js';

const W = 960, H = 540;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H); renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb3c8);
const cam = new THREE.PerspectiveCamera(40, W / H, 0.1, 100);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(4, 8, 6); sun.castShadow = true; scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x7c848c }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const crate = new THREE.MeshStandardMaterial({ color: 0xa87b4a });
const tex = makeTextures(renderer);
const mk = (c) => ({
  vest: new THREE.MeshStandardMaterial({ map: tex.vest(c), roughness: 0.6 }),
  pants: new THREE.MeshStandardMaterial({ color: 0x2b3442, roughness: 0.8 }),
  skin: new THREE.MeshStandardMaterial({ color: 0xe0b48f, roughness: 0.7 }),
  hat: new THREE.MeshStandardMaterial({ color: 0xf2c014, roughness: 0.4 }),
  visor: new THREE.MeshStandardMaterial({ color: 0x111111 }),
  belt: new THREE.MeshStandardMaterial({ color: 0x222222 }),
});

// Szenen: jede liefert pro Zeitpunkt den Spielerzustand
const G = 26, JUMP = 9.2;
const scenes = {
  lauf: { label: 'Stehen → Gehen → Rennen → Stopp', len: 7, cam: [6, 2.2, 3], look: [0, 1, 3],
    state(t, s) {
      const v = t < 1 ? 0 : t < 3 ? 2 : t < 5.5 ? 6 : 0;
      s.sp = (s.sp ?? 0) + (v - (s.sp ?? 0)) * Math.min(1, 1 / 60 * (v ? 6 : 12));
      s.z = (s.z ?? -6) + s.sp / 60;
      return { pos: [0, 0, s.z], vel: [0, 0, s.sp], yaw: 0, grounded: true, mode: MODE.GROUND };
    }, follow: true },
  sprung: { label: 'Sprung (Anlauf) → Landung, dann harter Sturz', len: 6.5, cam: [8, 3, 2], look: [0, 1.5, 2],
    state(t, s) {
      if (t < 0.6) return { pos: [0, 0, -3 + t * 3], vel: [0, 0, 5], yaw: 0, grounded: true, mode: 0 };
      if (t < 0.6 + 2 * JUMP / G) { const u = t - 0.6; const y = JUMP * u - G * u * u / 2;
        return { pos: [0, y, -1.2 + u * 5], vel: [0, JUMP - G * u, 5], yaw: 0, grounded: false, mode: 1 }; }
      const t2 = 0.6 + 2 * JUMP / G;
      if (t < t2 + 1.4) return { pos: [0, 0, -1.2 + 2 * JUMP / G * 5], vel: [0, 0, 0], yaw: 0, grounded: true, mode: 0 };
      const u = t - t2 - 1.4, y = Math.max(0, 7 - G * u * u / 2), z = -1.2 + 2 * JUMP / G * 5;
      return { pos: [0, y, z], vel: [0, y > 0 ? -G * u : 0, 0], yaw: 0, grounded: y <= 0, mode: y > 0 ? 1 : 0 };
    } },
  kante: { label: 'Kante greifen → hängen → hochziehen', len: 5, cam: [6.5, 3.2, -1.2], look: [0, 2.0, 0.8],
    setup() { const b = new THREE.Mesh(new THREE.BoxGeometry(3, 2.1, 2), crate); b.position.set(0, 1.05, 1.5); b.castShadow = b.receiveShadow = true; return [b]; },
    state(t) {
      if (t < 0.5) return { pos: [0, 0, 0], vel: [0, 0, 0], yaw: 0, grounded: true, mode: 0 };
      if (t < 0.9) { const u = t - 0.5; const y = Math.max(0, 8 * u - G * u * u / 2); return { pos: [0, y, 0.15], vel: [0, 8 - G * u, 0.5], yaw: 0, grounded: false, mode: 1 }; }
      if (t < 2.6) return { pos: [0, 2.1 - 1.95, 0.2], vel: [0, 0, 0], yaw: 0, grounded: false, braced: true, mode: MODE.HANG };
      return { pos: [0, 2.1, 0.75], vel: [0, 0, 0], yaw: 0, grounded: true, mode: 0 };
    } },
  leiter: { label: 'Leiter hoch, oben aussteigen', len: 4.5, cam: [7, 3.6, -2.5], look: [0, 3.0, 0.5],
    setup() { const b = new THREE.Mesh(new THREE.BoxGeometry(3, 4, 2), crate); b.position.set(0, 2, 1.4); b.castShadow = b.receiveShadow = true; return [b]; },
    state(t) {
      if (t < 3.5) { const y = 0.1 + (t < 1.6 ? t : t < 2 ? 1.6 : t - 0.4) * 1.3; return { pos: [0, Math.min(y, 3.95), 0.1], vel: [0, 0, 0], yaw: 0, grounded: false, braced: true, mode: MODE.LADDER }; }
      return { pos: [0, 4, 0.85], vel: [0, 0, 0], yaw: 0, grounded: true, mode: 0 };
    } },
  haken: { label: 'Am Kranhaken schwingen und abspringen', len: 4.5, cam: [7, 3, 0], look: [0, 2.5, 0],
    state(t) {
      const P = [0, 6.2, 0], L = 2.2, a = Math.sin(t * 2.1) * 0.7 * Math.min(1, t / 1.2), w = Math.cos(t * 2.1) * 2.1 * 0.7;
      if (t < 3.6) {
        const hx = P[2] + Math.sin(a) * L, hy = P[1] - Math.cos(a) * L;
        return { pos: [0, hy - 1.95, hx], vel: [0, Math.sin(a) * w * L, Math.cos(a) * w * L], yaw: 0, grounded: false, braced: true, mode: MODE.HOOK, grip: P };
      }
      const u = t - 3.6, z0 = Math.sin(Math.sin(3.6 * 2.1) * 0.7) * L, y0 = P[1] - Math.cos(Math.sin(3.6 * 2.1) * 0.7) * L - 1.95;
      const y = Math.max(0, y0 + 5.5 * u - G * u * u / 2);
      return { pos: [0, y, z0 + u * 4], vel: [0, 5.5 - G * u, 4], yaw: 0, grounded: y <= 0, mode: y > 0 ? 1 : 0 };
    } },
  seil: { label: 'Seilruck von rechts: links frei, rechts festhaltend', len: 4, cam: [-0.5, 2.0, 7], look: [-0.5, 1, 0],
    state(t) { const k = t > 1 && t < 3 ? 1 : 0; return { pos: [0, 0, 0], vel: [k ? 0.8 : 0, 0, 0], yaw: -Math.PI / 2, grounded: true, mode: 0, pull: [k, 0.15 * k, 0] }; },
    state2(t) { const k = t > 1 && t < 3 ? 1 : 0; return { pos: [0, 0, 0], vel: [0, 0, 0], yaw: Math.PI / 2, grounded: true, braced: t > 0.5, mode: 0, pull: [k, 0.1 * k, 0] }; } },
  strom: { label: 'Stromschlag mit Rückstoß', len: 3, cam: [6, 2.2, 0], look: [0, 1.4, 0],
    state(t) {
      if (t < 0.6) return { pos: [0, 0, t * 4 - 2.4], vel: [0, 0, 4], yaw: 0, grounded: true, mode: 0 };
      const u = t - 0.6, y = Math.max(0, 6.5 * u - G * u * u / 2);
      return { pos: [0, y, 0 - Math.min(u, 0.5) * 6], vel: [0, y > 0 ? 6.5 - G * u : 0, u < 0.5 ? -6 : 0], yaw: 0, grounded: y <= 0 && u > 0.1, mode: y > 0 || u < 0.1 ? 1 : 0, hurt: u < 0.8 };
    } },
};

const q = new URLSearchParams(location.search);
const sc = scenes[q.get('s') || 'lauf'];
document.getElementById('l').textContent = sc.label;
for (const o of sc.setup ? sc.setup() : []) scene.add(o);
const rigs = [new Rig(mk('#e8562a'))];
if (sc.state2) rigs.push(new Rig(mk('#2a8be8')));
rigs.forEach((r, i) => { scene.add(r.root); r.root.traverse((o) => { if (o.isMesh) o.castShadow = true; }); });
const st = [{}, {}];
let t = 0;
window.step = (dt) => {
  t += dt;
  const tt = t % sc.len;
  rigs.forEach((r, i) => {
    const s = (i ? sc.state2 : sc.state)(tt, st[i]);
    s.braced = !!s.braced; s.hurt = !!s.hurt;
    if (i === 1) s.pos = [s.pos[0] + 1.2, s.pos[1], s.pos[2]];
    if (i === 0 && sc.state2) s.pos = [s.pos[0] - 2.2, s.pos[1], s.pos[2]];
    r.update(s, dt);
  });
  const f = sc.follow ? rigs[0].root.position.z : 0;
  cam.position.set(sc.cam[0], sc.cam[1], sc.cam[2] + f);
  cam.lookAt(sc.look[0], sc.look[1], sc.look[2] + (sc.follow ? f - 3 : 0));
  renderer.render(scene, cam);
};
window.len = sc.len;
window.step(0.0001);
</script></body></html>
